<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet" />
        <link
            rel="stylesheet"
            href="../css/null.css" />
        <link
            rel="stylesheet"
            href="../css/style.css" />
        <link
            rel="stylesheet"
            href="../css/media.css" />
        <title>Contact Us</title>
    </head>
    <body>
        <nav>
            <div class="container nav-container">
                <div class="logo">
                    <a href="../index.html">NEOPARK</a>
                </div>
                <div class="burger">
                    <span></span>
                </div>
            </div>
            <div class="container burger-container deactive"></div>
        </nav>
        <header>
            <div class="hero gradient-from-left">
                <div class="container">
                    <h1 class="hero-title">Contact Us</h1>
                    <div class="hero-ball1 gradient-from-left"></div>
                    <div class="hero-ball2 gradient-from-right"></div>
                </div>
            </div>
        </header>
        <main>
            <section>
                <div class="container">
                    <div class="title centered subtitled">Form</div>
                    <div class="subtitle centered">Leave your information and we will reach out</div>
                    <form
                        action="./success.html"
                        class="contact-form">
                        <div>
                            <label for="name">Name</label>
                            <input
                                autocomplete="off"
                                type="text"
                                id="name"
                                name="name"
                                required />
                        </div>
                        <div>
                            <label for="email">Email</label>
                            <input
                                type="email"
                                autocomplete="off"
                                id="email"
                                name="email"
                                required />
                        </div>
                        <div>
                            <label for="phone">Phone number</label>
                            <input
                                type="tel"
                                autocomplete="off"
                                id="phone"
                                name="phone"
                                required />
                        </div>
                        <div>
                            <label for="subject">Subject</label>
                            <select name="Subject" id="subject">
                                <option value="General Inquiry">General Inquiry</option>
                                <option value="Ticket Booking">Ticket Booking</option>
                                <option value="Group Booking">Group Booking</option>
                                <option value="Lost & Found">Lost & Found</option>
                                <option value="Feedback/Complaint">Feedback/Complaint</option>
                            </select>
                        </div>
                        <div>
                            <label for="date">Visit Date</label>
                            <input
                                type="date"
                                id="date"
                                name="date"
                                required />
                        </div>
                        <div>
                            <label for="message">Message</label>
                            <textarea
                                autocomplete="off"
                                id="message"
                                name="message"
                                rows="5"
                                required></textarea>
                        </div>
                        <div class="checkbox">
                            <label for="method">Preferred Response Method</label>
                            <div>
                                <input type="checkbox" name="method" id="method-email" value="Email" checked /> Email
                            </div>
                            <div>
                                <input type="checkbox" name="method" id="method-phone" value="Phone Call" /> Phone Call
                            </div>
                            <div>
                                <input type="checkbox" name="method" id="method-text" value="Text Message" /> Text Message
                            </div>
                        </div>
                        <button
                            type="submit"
                            class="btn btn-primary">
                            Submit
                        </button>
                    </form>
                </div>
            </section>
        </main>
        <footer>
            <div class="container">
                <div class="copyright">© KAIU</div>
            </div>
        </footer>
        <script src="../js/nav.js"></script>
        <script src="../js/hero.js"></script>
    </body>
</html>
